<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAPP Renderer Dashboard & Screen Monitor</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #16161a;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #4b5563;
            --secondary-hover: #374151;
            --success: #10b981;
            --danger: #ef4444;
            --border: #27272a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Split screen 50/50 */
        }

        /* Responsive design for smaller screens/phones */
        @media (max-width: 900px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: 60vh 40vh;
                height: auto;
            }
        }

        /* ==============================================================================
           LEFT COLUMN: SCREEN MONITOR WINDOW
           ============================================================================== */
        .screen-monitor-panel {
            background-color: #09090b;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            height: 100%;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .iframe-container {
            flex: 1;
            background-color: #000;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        .phone-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        /* ==============================================================================
           RIGHT COLUMN: CONTROL DASHBOARD PANEL
           ============================================================================== */
        .control-panel {
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 6px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        .status-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .status-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            min-width: 90px;
            transition: all 0.2s ease;
        }

        .status-UNKNOWN { background-color: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; }
        .status-RUNNING { background-color: rgba(16, 185, 129, 0.12); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); }
        .status-STOPPED { background-color: rgba(239, 68, 68, 0.12); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-secondary { background-color: var(--secondary); }
        .btn-secondary:hover { background-color: var(--secondary-hover); }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .console-box {
            background-color: #09090b;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            color: #38bdf8;
            max-height: 180px;
            overflow-y: auto;
        }

        .log-row { margin-bottom: 6px; line-height: 1.5; }
        .log-row:last-child { margin-bottom: 0; }
        .timestamp { color: #52525b; margin-right: 8px; font-weight: 500; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="screen-monitor-panel">
    <div class="panel-title">📱 Live Screen Feed</div>
    <div class="iframe-container">
        <iframe src="http://192.168.111.111:8233/screen/#!action=stream&udid=192.168.111.48%3A5555&player=mse&ws=ws%3A%2F%2F192.168.111.111%3A8233%2Fscreen%2F%3Faction%3Dproxy-adb%26remote%3Dtcp%253A8886%26udid%3D192.168.111.48%253A5555" class="phone-frame" allowfullscreen></iframe>
    </div>
</div>

<div class="control-panel">
    <div class="container">
        <div class="header">
            <h1>Renderer Control</h1>
            <div class="subtitle">On-demand media network manager</div>
        </div>

        <div class="card">
            <div class="status-wrapper">
                <div class="status-info">
                    <div class="status-title">Network Identity Status</div>
                    <div style="font-size: 12px; color: var(--text-muted)">Target: MI Player</div>
                </div>
                <span id="statusBadge" class="status-badge status-UNKNOWN">UNKNOWN</span>
            </div>
        </div>

        <div class="card">
            <div class="button-group">
                <button id="checkBtn" class="btn btn-secondary" onclick="checkStatus()">
                    <div id="checkSpinner" class="spinner"></div>
                    Check Status
                </button>

                <button id="triggerBtn" class="btn btn-primary" onclick="triggerAutomation()">
                    <div id="triggerSpinner" class="spinner"></div>
                    Trigger Macro
                </button>
            </div>
        </div>

        <div class="card" style="padding: 20px;">
            <div class="console-header">
                <span>Activity Logs</span>
                <span style="font-size: 11px; font-weight: normal; cursor:pointer; color: var(--primary);" onclick="clearLogs()">Clear</span>
            </div>
            <div id="console" class="console-box">Dashboard runtime connected. Waiting for command...</div>
        </div>
    </div>
</div>

<script>
    // Detect environment dynamically to point to API address safely
    const API_BASE_URL = window.location.origin === "null" || window.location.protocol === "file:"
        ? "http://localhost:8833"
        : window.location.origin;

    const statusBadge = document.getElementById('statusBadge');
    const checkBtn = document.getElementById('checkBtn');
    const triggerBtn = document.getElementById('triggerBtn');
    const checkSpinner = document.getElementById('checkSpinner');
    const triggerSpinner = document.getElementById('triggerSpinner');
    const consoleBox = document.getElementById('console');

    function log(message, type = "info") {
        const time = new Date().toLocaleTimeString();
        let colorStyle = "";
        if (type === "success") colorStyle = "style='color: #10b981;'";
        if (type === "error") colorStyle = "style='color: #ef4444;'";

        consoleBox.innerHTML += `<div class="log-row" ${colorStyle}><span class="timestamp">[${time}]</span>${message}</div>`;
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function clearLogs() {
        consoleBox.innerHTML = '<div class="log-row"><span class="timestamp">[' + new Date().toLocaleTimeString() + ']</span> Logs cleared.</div>';
    }

    // ON-DEMAND MANUALLY CONTROLLED NETWORK STATUS CHECK
    async function checkStatus() {
        checkBtn.disabled = true;
        checkSpinner.style.display = "block";
        log("🛰️ Initiating deep multi-pass network check...");

        try {
            const response = await fetch(`${API_BASE_URL}/status`);
            if (!response.ok) throw new Error('Container unreachable');
            const data = await response.json();

            statusBadge.className = `status-badge status-${data.status}`;
            statusBadge.innerText = data.status === "RUNNING" ? "ACTIVE" : "OFFLINE";

            if (data.status === "RUNNING") {
                log("🟢 Network Scan Result: 'MI Player' verified active on Wi-Fi subnet.", "success");
            } else {
                log("🔴 Network Scan Result: Service not found on network stack.", "error");
            }
        } catch (error) {
            statusBadge.className = "status-badge status-UNKNOWN";
            statusBadge.innerText = "ERROR";
            log(`❌ Status Query Error: Could not talk to API server (${error.message})`, "error");
        } finally {
            checkBtn.disabled = false;
            checkSpinner.style.display = "none";
        }
    }

    // ON-DEMAND MACRO EXECUTION
    async function triggerAutomation() {
        triggerBtn.disabled = true;
        triggerSpinner.style.display = "block";
        log("⚡ Dispatching async activation command to API...");

        try {
            const response = await fetch(`${API_BASE_URL}/trigger`, { method: 'POST' });
            if (!response.ok) throw new Error('API server rejected the payload');
            const data = await response.json();

            log(`📬 API Accepted task: ${data.message}`);
            log(`ℹ️ Workflow execution: ${data.detail}`);
        } catch (error) {
            log(`❌ Failure sending pipeline request: {${error.message}}`, "error");
        } finally {
            setTimeout(() => {
                triggerBtn.disabled = false;
                triggerSpinner.style.display = "none";
            }, 2000);
        }
    }

    log(`Endpoint linked to daemon layer: ${API_BASE_URL}`);
</script>

</body>
</html>
